name: Build Android APK
on:
  push:
    branches: [main]
    paths: ['www/**', 'android/**', 'capacitor.config.json', 'package.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_KS: ${{ secrets.MISE_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Install Capacitor
        run: npm install --no-audit --no-fund
      - name: Copy web app into the Android project
        run: npx cap sync android
      - name: Use signing key from secrets (optional)
        if: env.HAS_KS == 'true'
        env:
          KS: ${{ secrets.MISE_KEYSTORE_BASE64 }}
        run: |
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MISE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "MISE_STORE_PASSWORD=${{ secrets.MISE_STORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "MISE_KEY_ALIAS=${{ secrets.MISE_KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "MISE_KEY_PASSWORD=${{ secrets.MISE_KEY_PASSWORD }}" >> "$GITHUB_ENV"
      - name: Build signed release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Mise-1.0.${VERSION_CODE}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Mise-apk
          path: Mise-*.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Mise 1.0.${{ github.run_number }}
          files: Mise-*.apk
          make_latest: true
          body: |
            Android build of Mise. Download the APK below on your phone and open it to install.
            First time: Android will ask you to allow installs from your browser or Files app.
