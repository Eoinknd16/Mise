name: Harvest world ingredients (Wikidata)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Harvest from Wikidata
        run: node tools/wikidata_harvest.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: harvest
          path: harvest/
          retention-days: 14
