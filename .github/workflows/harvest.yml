name: Harvest world ingredients (Wikidata)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Harvest from Wikidata
        run: node tools/wikidata_harvest.mjs
      - name: Save to the harvest-data branch
        run: |
          gzip -9 -k harvest/items.json
          mkdir -p /tmp/out && cp harvest/items.json.gz harvest/roots.json /tmp/out/
          git config user.name "Mise harvest" && git config user.email "actions@users.noreply.github.com"
          git checkout --orphan harvest-data && git rm -rq --cached . && git clean -fdxq -e harvest
          cp /tmp/out/* . && git add items.json.gz roots.json
          git commit -qm "Wikidata harvest $(date -u +%F)" && git push -f origin harvest-data
